[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skepis"
version = "0.1.4"
description = "Local-first exposure-aware evaluation tooling"
requires-python = ">=3.11"
dependencies = ["mcp>=1.27.0,<2", "sibyl-memory-client>=0.7.0"]

[project.scripts]
skepis = "skepis.cli:main"
skepis-mcp = "skepis.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
